name: Build and Deploy Manhwa Tower

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Extension
        run: |
          chmod +x gradlew
          ./gradlew spotlessApply
          ./gradlew :src:fa:mt98:assembleRelease

      - name: Generate Repository JSON
        run: |
          mkdir -p repo
          cp src/fa/mt98/build/outputs/apk/release/*.apk repo/
          
          APK_FILE=$(ls repo/*.apk)
          APK_NAME=$(basename "$APK_FILE")
          
          cat <<JSONEOF > repo/index.json
          {
            "name": "Manhwa Tower Repository",
            "badgeLabel": "Manhwa Tower",
            "signingKey": "",
            "contact": "",
            "metadata": {
              "version": 2
            },
            "packages": [
              {
                "name": "Manhwa Tower",
                "pkg": "eu.kanade.tachiyomi.extension.fa.mt98",
                "apk": "${APK_NAME}",
                "version": "1.6.2",
                "code": 2,
                "lang": "fa",
                "nsfw": 0,
                "sources": [
                  {
                    "name": "Manhwa Tower",
                    "lang": "fa",
                    "id": 5970593691071522164,
                    "baseUrl": "https://mt98.ir"
                  }
                ]
              }
            ]
          }
          JSONEOF

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./repo
          publish_branch: gh-pages